[env:nodemcu-32s]
; Exact versions are intentional. Upgrade them only after hardware testing.
platform = platformio/espressif32@7.0.1
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.0
    platformio/tool-mkfatfs@2.0.1
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@2.230.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_ARCH_ESP32
lib_ignore =
    WiFiNINA
lib_deps =
    robtillaart/AD9833@0.4.5
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit ADS1X15@2.6.2
    arduino-libraries/Arduino_CloudUtils@1.2.0
    arduino-libraries/Arduino_DebugUtils@1.5.0
    arduino-libraries/Arduino_ConnectionHandler@1.3.0
    arduino-libraries/ArduinoMqttClient@0.1.8
    arduino-libraries/ArduinoHttpClient@0.6.1
    arduino-libraries/Arduino_NetworkConfigurator@0.5.1
    arduino-libraries/ArduinoIoTCloud@2.10.0
    tzapu/WiFiManager@2.0.17
